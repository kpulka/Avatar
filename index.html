<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar 3D — Real-time Conversational WebGL</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="avatar-canvas"></canvas>

      <!-- WebGL fallback overlay: empty mount, the card is rendered by src/ui/webgl-fallback.ts -->
      <div id="webgl-fallback" class="overlay hidden"></div>

      <!-- UI root: user layer (dock/status/captions/segment/settings), studio shell, shared (toast/loader/modal) -->
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
